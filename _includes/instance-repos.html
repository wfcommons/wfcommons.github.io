<div class="grid3">
    {% for trace in site.data.traces %}
    <div class="card{% if include.reveal %} reveal{% endif %}">
        <span class="iconChip teal" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>
        </span>
        <h3>{{ trace.name }}</h3>
        <div class="miniStats">
            <div><b>{{ trace.traces }}</b><span>instances</span></div>
            <div><b>{{ trace.applications }}</b><span>applications</span></div>
        </div>
        <a class="more" href="{{ trace.website }}" target="_blank" rel="noreferrer">View on GitHub →</a>
    </div>
    {% endfor %}
</div>
